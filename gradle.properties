# ==========================================
# 1. إعدادات بيئة أندرويد (Android Environment)
# ==========================================
# تفعيل أندرويد إكس (إلزامي للمكتبات الحديثة)
android.useAndroidX=true

# إيقاف Jetifier لزيادة سرعة البناء (بما أننا نستخدم مكتبات حديثة كلياً)
android.enableJetifier=false

# تجاوز تحذيرات إصدار SDK (ضروري لأننا نستخدم SDK 35)
android.suppressUnsupportedCompileSdk=35

# منع تداخل الموارد (Resources) لتسريع الـ Build وتقليل حجم التطبيق
android.nonTransitiveRClass=true

# ==========================================
# 2. إعدادات محرك Gradle والذاكرة (JVM & Daemon)
# ==========================================
# إبقاء محرك Gradle يعمل في الخلفية لتسريع البناء
org.gradle.daemon=true

# تخصيص حجم الذاكرة (RAM) لعملية البناء لضمان استقرار KAPT و Room (تم دمج الأسطر المكررة)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ==========================================
# 3. إعدادات تسريع البناء (Performance & Caching)
# ==========================================
# تفعيل المعالجة المتوازية لزيادة سرعة الـ Build
org.gradle.parallel=true

# تفعيل التخزين المؤقت (Caching) لعمليات البناء السابقة
org.gradle.caching=true

# 🚀 تفعيل "التخزين المؤقت للتهيئة" (يختصر وقت البناء بشكل هائل في مرات التشغيل المتتالية)
org.gradle.configuration-cache=true

# ==========================================
# 4. إعدادات لغة Kotlin
# ==========================================
# تحسين أداء لغة Kotlin أثناء المعالجة
kotlin.incremental=true
kotlin.code.style=official

# 🚀 تفعيل الدعم التجريبي لـ kapt ليتوافق مع Kotlin 2.0 (أداء أسرع في توليد الأكواد)
kapt.use.k2=true
