name: Build Abdullah Tool Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    name: Native Build & Assembly
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # ⚙️ 1. Core Logic: Environment & Toolchains
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 🛠️ تم التصحيح: توليد Gradle Wrapper بإصدار 8.4 ليتوافق مع Kotlin 2.1.0 وإعداداتنا السابقة
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      
      # ==========================================
      # 🚀 3. Core Logic: Build Engine
      # ==========================================
      - name: Build Release APK
                # ⚡ تفعيل التخزين المؤقت والمعالجة المتوازية لتسريع البناء
        run: ./gradlew assembleRelease --build-cache --parallel --no-daemon

      # ==========================================
      # 📦 4. UI / Presentation: Artifact Distribution
      # ==========================================
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Abdullah-Tool-Bridge-${{ github.run_number }}
          # 🎯 تم تحسين المسار ليكون دقيقاً لملفات الـ Release فقط
          path: app/build/outputs/apk/release/*.apk
          retention-days: 5
